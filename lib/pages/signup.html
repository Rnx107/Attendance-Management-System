<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Attendance Management Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-body">
  <div class="login-container">
    <div class="logo-box">
  <img src="assets/images/download.png" alt="Kathmandu University Logo" class="ku-logo" />
</div>
    <h2>Login As</h2>
    <div class="role-tabs">
      <button class="tab-btn active" data-role="student">Student</button>
      <button class="tab-btn" data-role="teacher">Teacher</button>
      <button class="tab-btn" data-role="admin">Admin</button>
    </div>

    <form id="loginForm">
      <input type="email" id="email" placeholder="name@kusoed.edu.np" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit" class="btn login-btn">Log in</button>
      <p id="errorMsg" class="error"></p>
    </form>

    <div class="login-links">
      <a href="#">forget password?</a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

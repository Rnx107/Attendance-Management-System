{% extends 'base.html' %}
{% block title %}{{ page_title }} - AMS{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3 border-0">
                <h4 class="mb-0 fw-bold"><i class="bi bi-journal-check me-2"></i>{{ page_title }}</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Course Name</label>
                        <input type="text" name="course_name" class="form-control" placeholder="e.g. Computer Science"
                            value="{{ course.course_name|default:'' }}" required>
                    </div>
                    {% if course %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Status</label>
                        <select name="status" class="form-select">
                            {% if course.status == 'active' %}
                            <option value="active" selected>Active</option>
                            <option value="inactive">Inactive</option>
                            {% else %}
                            <option value="active">Active</option>
                            <option value="inactive" selected>Inactive</option>
                            {% endif %}
                        </select>
                    </div>
                    {% endif %}
                    <div class="mt-4 d-grid gap-2">
                        <button type="submit" class="btn btn-primary py-2 fw-bold">
                            {% if course %}Update Course{% else %}Create Course{% endif %}
                        </button>
                        <a href="{% url 'course_list' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

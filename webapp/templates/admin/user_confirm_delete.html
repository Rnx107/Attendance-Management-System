{% extends 'base.html' %}
{% block title %}Delete User - AMS{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 border-top border-danger border-4">
            <div class="card-body text-center py-5">
                <i class="bi bi-exclamation-triangle-fill text-danger fs-1 mb-3"></i>
                <h3 class="fw-bold">Delete User?</h3>
                <p class="text-muted mb-4">Are you sure you want to delete <strong>{{ user_to_delete.email }}</strong>?
                    This action cannot be undone.</p>
                <form method="POST">
                    {% csrf_token %}
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-danger py-2 fw-bold">Yes, Delete User</button>
                        <a href="{% url 'user_list' %}" class="btn btn-outline-secondary">No, Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block title %}{{ page_title }} - AMS{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3 border-0">
                <h4 class="mb-0 fw-bold"><i class="bi bi-layers me-2"></i>{{ page_title }}</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Semester Number</label>
                        <input type="number" name="semester_no" class="form-control" min="1" max="20" placeholder="e.g. 1" required>
                        <div class="form-text mt-2">Enter a numeric value (e.g. 1 for Semester 1).</div>
                    </div>
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{% url 'course_semesters' course.id %}" class="btn btn-outline-secondary px-4 me-md-2">Cancel</a>
                        <button type="submit" class="btn btn-primary px-5 fw-bold">
                            <i class="bi bi-plus-circle me-1"></i>Add Semester
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
